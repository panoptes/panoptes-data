[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.3"]
build-backend = "hatchling.build"

[project]
name = "panoptes-data"
description = "Tools for working with PANOPTES data."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Wilfred Tyler Gee", email = "wtylergee@gmail.com" },
]
keywords = ["astronomy", "panoptes", "data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "astropy",
    "numpy",
    "pandas",
    "panoptes-utils[images]",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "python-dateutil",
    "python-dotenv",
    "rich[jupyter]",
    "tabulate",
    "tqdm",
    "typer",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://projectpanoptes.org/"
Source = "https://github.com/panoptes/panoptes-data/"
Download = "https://pypi.org/project/panoptes-data/#files"

[project.scripts]
panoptes-data = "panoptes.data.utils.cli.main:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
include = ["src/panoptes/**", "README.md", "LICENSE.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/panoptes"]

# Development environments are `uv`'s, not `hatch`'s. `hatchling` remains the
# build backend and `hatch-vcs` still derives the version from the git tag --
# those are how the package builds at all -- but the `[tool.hatch.envs.*]`
# blocks that duplicated these groups are gone.
[dependency-groups]
dev = [{ include-group = "test" }, "ruff>=0.5.0"]
# The documentation toolchain only. The runtime dependencies autodoc needs to
# import `panoptes.data` come from the project itself, which `uv sync` installs
# alongside this group -- relisting them here is how `docs/requirements.txt`
# drifted from `[project.dependencies]` until it was carrying `photutils`, which
# nothing in this package imports.
docs = [
    "linkify-it-py",
    "myst-parser",
    "pydata-sphinx-theme",
    "sphinx>=3.2.1",
]
test = [
    "coverage>=7.0,<8.0",
    "pytest>=7.0,<8.0",
    "pytest-cov>=4.0,<5.0",
    "pytest-doctestplus>=1.0,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# Notebooks are exploratory and re-running one re-dirties it; `docs/conf.py` is
# Sphinx boilerplate. Linting them produces churn nobody acts on, so
# `ruff check .` covers the code people actually edit.
extend-exclude = ["notebooks", "docs/conf.py"]

[tool.ruff.lint]
# The set `panoptes-pipeline` uses: pycodestyle errors, pyflakes, import
# sorting, pyupgrade. Selecting it explicitly is the point -- the default set
# moves between ruff versions, so an unpinned config makes "clean" mean
# something different on every machine.
select = ["E", "F", "I", "UP"]
