# The documentation site. Zensical builds `docs/` into `site/`; the GitHub
# Pages workflow publishes that.
[project]
site_name = "panoptes-data"
site_description = "Tools for working with PANOPTES data."
site_url = "https://panoptes.github.io/panoptes-data/"
repo_url = "https://github.com/panoptes/panoptes-data"
repo_name = "panoptes/panoptes-data"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Contributing" = "contributing.md" },
  { "Building the docs" = "building.md" },
  { "Changelog" = "changelog.md" },
  { "API reference" = [
    { "documents" = "api/documents.md" },
    { "observations" = "api/observations.md" },
    { "search" = "api/search.md" },
    { "settings" = "api/settings.md" },
    { "CLI" = "api/cli.md" },
  ] },
  { "Authors" = "authors.md" },
  { "License" = "license.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

# `README.md`, `CHANGELOG.md` and the rest live at the repository root, where
# GitHub and PyPI read them. The pages under `docs/` include them from there
# rather than holding a second copy -- the same rule as the dependencies.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true

# Docstrings are the API reference: `::: panoptes.data.search` in a Markdown
# file is the whole page. There is no generated intermediate to commit.
# `panoptes/data/utils` and `.../cli` carry no `__init__.py`, so griffe --
# which reads the source rather than importing it -- needs `paths` spelled out.
"zensical.extensions.mkdocstrings".handlers.python.paths = ["src"]
"zensical.extensions.mkdocstrings".handlers.python.options.docstring_style = "google"
"zensical.extensions.mkdocstrings".handlers.python.options.show_root_heading = true
"zensical.extensions.mkdocstrings".handlers.python.options.show_signature_annotations = true
"zensical.extensions.mkdocstrings".handlers.python.options.separate_signature = true
"zensical.extensions.mkdocstrings".handlers.python.options.members_order = "source"
"zensical.extensions.mkdocstrings".handlers.python.options.filters = ["!^_"]
