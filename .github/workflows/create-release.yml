# This will create a release for any properly tagged branch.
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v[0-9].[0-9]+.[0-9]+' # Push events to matching vX.Y.Z, but not vX.Y.Zdev

name: Create GitHub Release

jobs:
  deploy:
    name: Push Release to PyPi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from the tag, so it needs the history.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install build tool (Hatch)
        run: |
          python -m pip install --upgrade pip
          pip install hatch
      - name: Build package with Hatch
        run: |
          hatch clean
          hatch build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}          
