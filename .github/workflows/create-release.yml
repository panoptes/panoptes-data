# Publishes to PyPI and creates the GitHub release for any vX.Y.Z tag.
#
# Authentication is PyPI Trusted Publishing, which mints a short-lived OIDC
# token for this workflow instead of holding a long-lived API token. It needs a
# one-time setup on PyPI itself -- Manage project -> Publishing -> Add a new
# publisher, with owner `panoptes`, repository `panoptes-data`, and workflow
# `create-release.yml`. Without that, the publish step fails with an
# authentication error.
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Push events to matching vX.Y.Z, but not vX.Y.Zdev

name: Create GitHub Release

jobs:
  deploy:
    name: Push Release to PyPi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Mint the OIDC token Trusted Publishing authenticates with.
      contents: write   # Create the GitHub release.
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from the tag, so it needs the history.
          fetch-depth: 0
      # `actions/checkout` fetches the commit SHA *into* the tag ref
      # (`+<sha>:refs/tags/<name>`), so the checkout holds a lightweight tag
      # whatever the remote has. Re-fetching the ref restores the real tag
      # object; without this the check below fails every annotated tag, and
      # `%(contents)` reports the commit message rather than the tag message.
      - name: Restore the annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      # Before anything is built or published: the release notes come from the
      # tag message, and only an annotated tag has one. `%(contents)` on a
      # lightweight tag reports the *commit* message instead, which would
      # publish a commit subject as the release notes -- wrong, and plausible
      # enough to go unnoticed. Failing here costs nothing; failing after the
      # PyPI upload would leave a published version with no release.
      - name: Require an annotated tag
        run: |
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag. The release notes are the tag message, so the tag must be annotated: git tag -a ${GITHUB_REF_NAME} -m '...'"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install build tool (Hatch)
        run: |
          python -m pip install --upgrade pip
          pip install hatch
      - name: Build package with Hatch
        id: build
        run: |
          hatch clean
          hatch build
      - name: Publish package
        # No user/password: an explicit password disables Trusted Publishing,
        # and with it the build attestations this action produces by default.
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create the GitHub release
        # The annotated tag message is the release notes, so what the tag says
        # and what the release says cannot drift apart.
        #
        # This runs whenever there are dists to attach, including when the
        # publish failed. The release is built from the tag and the build, so a
        # PyPI-side problem -- a trusted-publisher claim that stops matching,
        # say -- should not cost the release as well; the two outputs fail
        # independently because they depend on different things.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --list --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          # An annotated tag with an empty message still yields a newline, so
          # this looks for actual content rather than a non-empty file.
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::${GITHUB_REF_NAME} has an empty tag message, and the release notes come from it."
            exit 1
          fi
          # Fixing a failed publish means re-running this job, so creating the
          # release has to be repeatable. `gh release create` refuses a tag that
          # already has one, which would turn the retry into a second failure.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              dist/*
          fi
