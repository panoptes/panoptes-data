name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # A pinned rule set that nothing runs is documentation, not a gate: the tree
  # drifts dirty and the next contributor cannot tell which findings are theirs.
  # Its own job, so a lint failure is legible as one rather than a red test run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Separate steps: "which one failed" should not need the log opened.
      - name: Check lint
        run: uv run --group dev ruff check .

      - name: Check formatting
        run: uv run --group dev ruff format --check .

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--locked` fails rather than re-resolving, so a dependency edit that
      # skipped `uv lock` is caught here instead of silently testing something
      # other than what the lockfile describes.
      - name: Install dependencies
        run: uv sync --locked --group test --python ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=panoptes.data --cov-report=xml:coverage.xml --cov-report=term-missing -q

      - name: Upload coverage (xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      # The artifact above is for looking at a single run; this is what gives
      # the README's coverage badge something to report. `fail_ci_if_error`
      # stays false deliberately: a coverage upload failing is not a reason to
      # fail a test run that passed.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
