name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # A pinned rule set that nothing runs is documentation, not a gate: the tree
  # drifts dirty and the next contributor cannot tell which findings are theirs.
  # Its own job, so a lint failure is legible as one rather than a red test run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Separate steps: "which one failed" should not need the log opened.
      - name: Check lint
        run: uv run --group dev ruff check .

      - name: Check formatting
        run: uv run --group dev ruff format --check .

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "pip-${{ runner.os }}-py-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}"
          restore-keys: |
            pip-${{ runner.os }}-py-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install broad dependencies used by the project/tests
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
          # Install the package itself
          pip install -e .
          # Install test tools
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=panoptes.data --cov-report=xml:coverage.xml --cov-report=term-missing -q

      - name: Upload coverage (xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
