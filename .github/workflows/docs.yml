name: Build and publish documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Required permissions for deploying to GitHub Pages
permissions:
  contents: write
  pages: write

jobs:
  # There is no test job here. The one that used to gate this build was a
  # second copy of `tests.yml`'s -- same suite, same coverage flags, same
  # `coverage-xml` artifact name -- running on the same events, so every push
  # paid for the suite twice and a failure showed up twice. `tests.yml` is
  # where the suite runs; a docs build that imports the package is its own
  # check that the package imports.
  build-docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `hatch-vcs` derives the version from the git tag, so the build
          # needs the tags, not just the tip.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The docs toolchain is the `docs` group; the runtime dependencies
      # autodoc imports come from the project, which `uv sync` installs with
      # it. `--locked` fails rather than re-resolving, so a dependency edit
      # that skipped `uv lock` is caught here.
      - name: Install dependencies
        run: uv sync --locked --group docs --python ${{ matrix.python-version }}

      - name: Build docs
        working-directory: docs
        run: uv run make html

      - name: Upload HTML docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: gh-pages
