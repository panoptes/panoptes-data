name: Build and publish documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Required permissions for deploying to GitHub Pages
permissions:
  contents: write
  pages: write

jobs:
  build-docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `hatch-vcs` derives the version from the git tag, so the build
          # needs the tags, not just the tip.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The docs toolchain is the `docs` group; the runtime dependencies
      # `mkdocstrings` imports come from the project, which `uv sync` installs
      # with it. `--locked` fails rather than re-resolving, so a dependency
      # edit that skipped `uv lock` is caught here.
      - name: Install dependencies
        run: uv sync --locked --group docs --python ${{ matrix.python-version }}

      # `--strict` turns warnings into errors: a link to a page that does not
      # exist, or a `:::` block naming a module that cannot be imported, fails
      # the build rather than publishing a hole.
      - name: Build docs
        run: uv run zensical build --clean --strict

      - name: Upload HTML docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: site

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
