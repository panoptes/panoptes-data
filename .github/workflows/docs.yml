name: Build and publish documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Publishing goes through the Pages deployment API rather than a commit to a
# branch, so the job needs an OIDC token to identify itself and no write access
# to the repository at all.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should publish the newest `main`, not wait its turn behind an
# older one; in-progress deployments are left to finish rather than cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `hatch-vcs` derives the version from the git tag, so the build
          # needs the tags, not just the tip.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The docs toolchain is the `docs` group; the runtime dependencies
      # `mkdocstrings` imports come from the project, which `uv sync` installs
      # with it. `--locked` fails rather than re-resolving, so a dependency
      # edit that skipped `uv lock` is caught here.
      - name: Install dependencies
        run: uv sync --locked --group docs --python ${{ matrix.python-version }}

      # `--strict` turns warnings into errors: a link to a page that does not
      # exist, or a `:::` block naming a module that cannot be imported, fails
      # the build rather than publishing a hole.
      - name: Build docs
        run: uv run --group docs zensical build --clean --strict

      # Uploaded on pull requests too, so a reviewer can download the built
      # site; only the deploy job below is gated on `main`.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-docs:
    name: Publish to GitHub Pages
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
